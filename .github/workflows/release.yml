name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A GitHub App / fine-grained token lets the release PR trigger CI.
          # Falls back to GITHUB_TOKEN (then CI must be run manually on the PR).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build panel
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Bundle must match the tagged source
        run: git diff --exit-code -- custom_components/ban_guard/frontend/
      - name: Check manifest version matches tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(python3 -c 'import json;print(json.load(open("custom_components/ban_guard/manifest.json"))["version"])')
          test "v${version}" = "${TAG}"
      - name: Zip integration
        run: |
          cd custom_components/ban_guard
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -X -r ../../ban_guard.zip . -x '*.pyc'
          cd ../..
          sha256sum ban_guard.zip > ban_guard.zip.sha256
          cat ban_guard.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ban_guard.zip
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ban_guard.zip ban_guard.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
