name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_*.txt
      - run: pip install -r requirements_lint.txt -r requirements_test.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      # The integration ships no Python requirements, so the gate covers our own
      # pinned toolchain. Home Assistant's pinned dependencies (pulled in by the
      # test harness) are reported but cannot be fixed here, so they don't fail CI.
      - name: pip-audit (toolchain, gating)
        run: pip-audit -r requirements_lint.txt --progress-spinner off
      - name: pip-audit (Home Assistant test environment, report only)
        continue-on-error: true
        run: pip-audit --progress-spinner off

  python-test:
    name: Tests (HA ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            python: "3.14"
            requirements: requirements_test.txt
            coverage: "--cov --cov-report=term-missing --cov-fail-under=90"
          - name: minimum
            python: "3.13"
            requirements: ci/min/requirements.txt
            coverage: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -p no:cacheprovider ${{ matrix.coverage }}

  frontend:
    name: Panel (type-check, lint, test, reproducible build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Committed bundle must match the source byte for byte
        working-directory: .
        run: |
          if ! git diff --exit-code --stat -- custom_components/ban_guard/frontend/; then
            echo "::error::custom_components/ban_guard/frontend/ban-guard-panel.js is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi
          test -z "$(git status --porcelain -- custom_components/ban_guard/frontend/)"

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master
