version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      python-dev:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bumped by .github/workflows/ha-compat.yml only after the suite passes on the
      # new Home Assistant release. ci/min/ (minimum supported HA) is not watched.
      - dependency-name: pytest-homeassistant-custom-component
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; a 7.x bump breaks
      # `npm ci`. Remove once typescript-eslint's peer range includes 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
