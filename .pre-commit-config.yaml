# Hooks are pinned to commit SHAs. Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
        args: [--unsafe] # blueprints use !input tags
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^custom_components/ban_guard/frontend/
      - id: trailing-whitespace
        exclude: ^custom_components/ban_guard/frontend/
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^custom_components/
      - id: frontend
        name: panel type-check, lint, test and rebuild
        entry: bash -c 'cd frontend && npm run check && npm run build'
        language: system
        files: ^frontend/
        pass_filenames: false
