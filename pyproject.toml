[project]
name = "ha-ban-guard"
version = "0.0.0"
description = "Home Assistant custom integration for managing IP bans"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PL", "PT", "ASYNC", "D", "C4", "PIE", "RET", "TID", "SLF"]
ignore = [
  "D203", "D213", "D105", "D107",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "S101", "D401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "SLF001", "PLC0415", "PLR2004", "BLE001", "RUF012", "PT011", "PT018", "PT022", "ASYNC230", "ASYNC240", "RUF015"]
"scripts/**" = ["D", "S", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.ban_guard", "homeassistant"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = false
files = ["custom_components/ban_guard"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# HA aliases voluptuous to probatio at runtime; let mypy treat it as untyped.
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]

[tool.coverage.run]
source = ["custom_components/ban_guard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
